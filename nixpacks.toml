[phases.setup]
# Use Node 20 LTS
nixPkgs = ["nodejs_20"]

[phases.install]
# Use ci for reproducible installs
cmds = ["npm ci"]

[phases.build]
# 1. Build Vite frontend (→ dist/)
# 2. Compile backend TypeScript (→ backend/dist/)
cmds = ["npm run build"]

[start]
# Serve with the Express server (serves static Vite build + API)
cmd = "node server/index.js"

# ── Deployment identity ─────────────────────────────────────────
# /api/build-info reports `gitSha` for the REPO_SHA == APP_SHA == RUNNER_SHA
# parity gate. Set the FULL 40-character commit SHA as a service/runtime
# variable on the platform:
#
#   APP_GIT_SHA = <full 40-char SHA of the deployed commit>
#
# Platform-provided variables are also read automatically when present:
# RAILWAY_GIT_COMMIT_SHA, RENDER_GIT_COMMIT, VERCEL_GIT_COMMIT_SHA,
# HEROKU_SLUG_COMMIT, GITHUB_SHA, SOURCE_COMMIT, GIT_COMMIT_SHA.
#
# Nixpacks does not know the commit by itself, so nothing is hardcoded here:
# an unset value is reported as gitSha: null and FAILS the parity gate rather
# than being fabricated.
